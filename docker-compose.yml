services:
  frontend:
    image: nginx:alpine
    ports:
      - "${LABSTOCK_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

  backend:
    build: ./backend
    expose:
      - "5000"
    environment:
      INVENTORY_DATA_DIR: /var/lib/backend_data
    volumes:
      - lab-inventory-data:/var/lib/backend_data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/inventory', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  lab-inventory-data:
    name: ${LABSTOCK_VOLUME_NAME:-lab-inventory-data}
