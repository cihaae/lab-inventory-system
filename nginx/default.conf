server {
    listen 80;
    server_name localhost;

    # Folder frontend di-mount (Bind Mount) ke sini oleh Docker Compose
    root /usr/share/nginx/html;
    index index.html;

    # Semua alamat biasa: sajikan file statis
    location / {
        try_files $uri $uri/ =404;
    }

    # Alamat berawalan /api/: teruskan ke Backend
    location /api/ {
        # DNS bawaan Docker; valid=10s = cari ulang alamat tiap 10 detik
        resolver 127.0.0.11 valid=10s;

        # Nama service Backend dan port di dalam container
        set $backend_upstream http://backend:5000;

        # Hapus awalan /api: /api/inventory?index=2 menjadi /inventory?index=2
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}